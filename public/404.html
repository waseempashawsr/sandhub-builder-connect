<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects all 404s to index.html so React Router can handle them
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      window.location.replace(
        window.location.origin + '/?ghp=' + encodeURIComponent(path + search + hash)
      );
    </script>
  </head>
  <body></body>
</html>
